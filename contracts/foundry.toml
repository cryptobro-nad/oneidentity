[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.28"
# Monad targets the Shanghai feature set for maximum portability.
# Avoids transient storage (TSTORE/TLOAD) and MCOPY entirely.
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

# RPC aliases. Values may be overridden by the matching environment variable.
# Primary and fallback were both latency-tested in spikes/mainnet-data.
[rpc_endpoints]
monad = "${MONAD_MAINNET_RPC_URL:-https://rpc.monad.xyz}"
monad_fallback = "${MONAD_MAINNET_FALLBACK_RPC_URL:-https://rpc3.monad.xyz}"

# Monadscan is Etherscan-V2 compatible and serves Monad Mainnet under
# chainid 143 (confirmed present in the Etherscan V2 chainlist with status 1).
# Foundry has no built-in alias for chain 143 — `cast chain` reports "unknown" —
# so the API URL must be given explicitly rather than inferred from --chain.
# The Sourcify/MonadVision path needs no key and is configured on the CLI.
[etherscan]
monad = {key = "${EXPLORER_API_KEY}", chain = 143, url = "https://api.etherscan.io/v2/api?chainid=143"}

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"
