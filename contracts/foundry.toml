[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.28"
# Monad targets the Shanghai feature set for maximum portability.
# Avoids transient storage (TSTORE/TLOAD) and MCOPY entirely.
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

# RPC aliases. Values may be overridden by the matching environment variable.
# Primary and fallback were both latency-tested in spikes/mainnet-data.
[rpc_endpoints]
monad = "${MONAD_MAINNET_RPC_URL:-https://rpc.monad.xyz}"
monad_fallback = "${MONAD_MAINNET_FALLBACK_RPC_URL:-https://rpc3.monad.xyz}"

# NOTE: deliberately no [etherscan] section.
#
# Foundry resolves every `${VAR}` in that block eagerly, for ANY verify
# invocation. A block referencing EXPLORER_API_KEY therefore aborts even the
# keyless `--verifier sourcify` path with "environment variable not found", and
# the `${VAR:-default}` form is not supported for that field. Both verification
# paths pass their settings explicitly on the command line instead — see
# docs/MAINNET_DEPLOYMENT.md. Foundry has no built-in alias for chain 143
# (`cast chain` reports "unknown"), so --verifier-url is always given.

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"
